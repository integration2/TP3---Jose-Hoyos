<!doctype html>
<html lang="fr-CA">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/normalize.css">
        <title>Commander une brochure gratuite</title>
    </head>
    <header>
        <h2 class="sous-titre__page">Publication gratuite</p>
        <h1 class="titre__page">Commander une <span class="accent">brochure</span> gratuite</h1>
    </header>
    <main>
    <body>
        <form action="index.html" method="get" class="formulaire">
            <fieldset id="format-brochure" class="section-formulaire">
            <div class="separateur"></div>
    
                <legend id="format-brochure__titre" class="section-brochure__titre">
                    <img class="image__titre" src="images/icon-format-brochure.svg">
                    <p>Format de la brochure</p>
                </legend>
                <ul class="format-brochure__liste">
                    <li class="format-brochure__liste-element">
                        <input type="radio" name="format-brochure__type" id="format-brochure__imprime" value="imprime" class="screen-reader-only">
                        <label for="format-brochure__imprime" class="format-brochure__label">
                            <img class="image__format-brochure" src="images/icon-file-print.svg">Imprimé</label>
                    </li>
                    <li class="format-brochure__liste-element">
                        <input type="radio" name="format-brochure__type" id="format-brochure__pdf" value="pdf" class="screen-reader-only">
                        <img class="image__format-brochure" src="images/icon-file-pdf.svg">
                        <label for="format-brochure__pdf" class="format-brochure__label">PDF</label>
                    </li>
                    <li class="format-brochure__liste-element">
                        <input type="radio" name="format-brochure__type" id="format-brochure__epub" value="epub" class="screen-reader-only">
                        <img class="image__format-brochure" src="images/icon-file-epub.svg">
                        <label for="format-brochure__epub" class="format-brochure__label">ePub</label>
                    </li>
                </ul>
                
            </fieldset>

            <fieldset id="informations-contact" class="section-formulaire">
                <legend id="information-contact__titre" class="section-brochure__titre">
                    <img class="image__titre" src="images/icon-contact.svg">
                    <p>Information de contact</p>
                </legend>
                <div class="separateur"></div>
                <label for="prenom">Prénom</label>
                <input type="text" name="prenom" id="information-contact__prenom">
                
                <label for="nom">Nom</label>
                <input type="text" name="nom" id="information-contact__nom">
                
                <label for="courriel">Courriel <span class="exemple">(exemple@domaine.com)</span></label>
                <input type="email" name="courriel" id="information-contact__courriel">

                <label for="telephone">Téléphone <span class="exemple">(514 555 0123)</span></label>
                <input type="tel" name="telephone" id="information-contact__telephone">
            </fieldset>

            <fieldset id="informations-postales" class="section-formulaire">
                <legend id="informations-postales" class="section-brochure__titre">
                    <p>Informations Postales</p>
                    <img class="image__titre" src="images/icon-postal.svg">
                </legend>
                <div class="separateur"></div>
                <label for="adresse">Adresse <span class="exemple">(123, rue Principale)</span></label>
                <input type="text" name="adresse" id="informations-postales__adresse">

                <label for="pays">Pays</label>
                <select name="pays" id="informations-postales__pays">
                    <option value="">- Sélectionner -</option>
                    <option value="1">Canada</option>
                    <option value="2">USA</option>
                </select>

                <label for="province-etat">Province ou État</label>
                <select name="province-etat" id="informations-postales__province-etat">
                    <option value="">- Sélectionner -</option>
                </select>

                <label for="code-postal">Code postal <span class="exemple">(A1A 1A1)</span></label>
                <input type="text" name="code-postal" id="informations-postales__code-postal" max="6">
            </fieldset>

            <filedset id="infolettre">
                <input type="checkbox" name="infolettre" id="infolettre-checkbox">
                <label for="infolettre-checkbox">Je désire recevoir des informations mensuelles par courriel sur les nouvelles publications et ressources disponibles</label>
            </filedset>

            <button name="btnCommander" value="Commander". formnovalidate>
                Commander
            </button>
        </form>
    </body>
    </main>
</html>
